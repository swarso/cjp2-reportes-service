<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Lista de Calificaciones con Tareas</title>
    <style>
        @page {
            size: letter landscape;
            margin: 12mm 14mm;
        }
        * { box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 8.5pt;
            margin: 0; padding: 0;
            color: #111;
        }
        table { border-collapse: collapse; width: 100%; }

        /* ── HEADER ── */
        .header-table td { padding: 2px 0; vertical-align: middle; }
        .cell-logo { width: 18%; }
        .logo-img { height: 60px; max-width: 100%; }
        .cell-titulo { width: 82%; text-align: center; }
        .colegio-nombre { font-size: 13pt; font-weight: bold; text-decoration: underline; }
        .reporte-nombre { font-size: 11pt; font-weight: bold; margin-top: 4px; }

        /* ── DATOS ── */
        .datos-table { margin-top: 8px; margin-bottom: 10px; }
        .datos-table td { padding: 2px 0; font-size: 9pt; }
        .datos-label { font-weight: bold; }

        /* ── ALUMNOS ── */
        .alumnos-table { border: 1px solid #333; }
        .alumnos-table th {
            background: #e5e5e5; font-size: 7.5pt; font-weight: bold;
            padding: 4px 3px; border: 1px solid #333;
            text-align: center;
        }
        .alumnos-table td {
            padding: 3px 3px; font-size: 8pt;
            border-left: 1px solid #333; border-right: 1px solid #333;
            border-bottom: 1px solid #ccc;
        }
        .th-num { width: 3%; }
        .th-nocontrol { width: 9%; }
        .th-nombre { width: 22%; text-align: left; }
        .th-cal { width: 7%; }
        .th-tarea { width: 5.5%; }
        .td-num { text-align: center; }
        .td-nocontrol { text-align: center; font-family: monospace; }
        .td-nombre { text-align: left; }
        .td-cal { text-align: center; font-variant-numeric: tabular-nums; }
        .td-tarea { text-align: center; font-variant-numeric: tabular-nums; color: #444; }

        /* ── FIRMA ── */
        .firma-table { margin-top: 40px; }
        .firma-table td { text-align: center; width: 45%; }
        .firma-linea { border-top: 1px solid #111; margin: 0 12mm; padding-top: 4px; font-size: 8.5pt; }
        .firma-nombre { font-weight: bold; }
    </style>
</head>
<body>

<!-- ══════════════════════ HEADER ══ -->
<table class="header-table">
    <tr>
        <td class="cell-logo">
            <img th:if="${reporte.logoBase64 != null and !reporte.logoBase64.isEmpty()}"
                 th:src="${reporte.logoBase64}" class="logo-img" th:alt="${reporte.nombreColegio}"/>
        </td>
        <td class="cell-titulo">
            <div class="colegio-nombre" th:text="${reporte.nombreColegio}">Colegio Juan Pablo II</div>
            <div class="reporte-nombre">LISTA DE CALIFICACIONES Y TAREAS</div>
        </td>
    </tr>
</table>

<!-- ══════════════════════ DATOS MATERIA/GRUPO ══ -->
<table class="datos-table">
    <tr>
        <td class="datos-label" style="width:12%;">MATERIA:</td>
        <td style="width:58%;" th:text="${reporte.descripcionMateria}">—</td>
        <td class="datos-label" style="width:10%;">FECHA:</td>
        <td style="width:20%;" th:text="${reporte.fechaReporte}">—</td>
    </tr>
    <tr>
        <td class="datos-label">GRUPO:</td>
        <td th:text="${reporte.descripcionGrupo != null ? reporte.descripcionGrupo : '—'}">—</td>
        <td class="datos-label">PERIODO:</td>
        <td th:text="${reporte.periodoEscolar != null ? reporte.periodoEscolar : '—'}">—</td>
    </tr>
</table>

<!-- ══════════════════════ ALUMNOS ══ -->
<table class="alumnos-table">
    <thead>
        <tr>
            <th class="th-num">#</th>
            <th class="th-nocontrol">NO. CONTROL</th>
            <th class="th-nombre">NOMBRE</th>
            <th class="th-cal">CALIF. 1</th>
            <th class="th-tarea">TA1</th>
            <th class="th-tarea">TE1</th>
            <th class="th-cal">CALIF 2.</th>
            <th class="th-tarea">TA2</th>
            <th class="th-tarea">TE2</th>
            <th class="th-cal" th:if="${reporte.mostrarCalifOrdinaria3}">CALIF 3.</th>
            <th class="th-tarea" th:if="${reporte.mostrarCalifOrdinaria3}">TA3</th>
            <th class="th-tarea" th:if="${reporte.mostrarCalifOrdinaria3}">TE3</th>
            <th class="th-cal">FINAL</th>
            <th class="th-cal">FALTAS</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="alumno, iter : ${reporte.alumnos}">
            <td class="td-num" th:text="${iter.count}">1</td>
            <td class="td-nocontrol" th:text="${alumno.nocontrol}">—</td>
            <td class="td-nombre" th:text="${alumno.nombreAlumno}">—</td>
            <td class="td-cal" th:text="${alumno.cal1 != null ? #numbers.formatDecimal(alumno.cal1, 1, 2) : '—'}">0.00</td>
            <td class="td-tarea" th:text="${alumno.ta1 != null ? alumno.ta1 : '—'}">—</td>
            <td class="td-tarea" th:text="${alumno.te1 != null ? alumno.te1 : '—'}">—</td>
            <td class="td-cal" th:text="${alumno.cal2 != null ? #numbers.formatDecimal(alumno.cal2, 1, 2) : '—'}">0.00</td>
            <td class="td-tarea" th:text="${alumno.ta2 != null ? alumno.ta2 : '—'}">—</td>
            <td class="td-tarea" th:text="${alumno.te2 != null ? alumno.te2 : '—'}">—</td>
            <td class="td-cal" th:if="${reporte.mostrarCalifOrdinaria3}" th:text="${alumno.cal3 != null ? #numbers.formatDecimal(alumno.cal3, 1, 2) : '—'}">0.00</td>
            <td class="td-tarea" th:if="${reporte.mostrarCalifOrdinaria3}" th:text="${alumno.ta3 != null ? alumno.ta3 : '—'}">—</td>
            <td class="td-tarea" th:if="${reporte.mostrarCalifOrdinaria3}" th:text="${alumno.te3 != null ? alumno.te3 : '—'}">—</td>
            <td class="td-cal" th:text="${alumno.calFinal != null ? #numbers.formatDecimal(alumno.calFinal, 1, 2) : '—'}">0.00</td>
            <td class="td-cal" th:text="${alumno.faltas != null ? alumno.faltas : '—'}">0</td>
        </tr>
    </tbody>
</table>

<!-- ══════════════════════ FIRMA ══ -->
<table class="firma-table">
    <tr>
        <td>
            <div class="firma-linea">
                <div class="firma-nombre" th:text="${reporte.nombreDocente != null ? reporte.nombreDocente : ''}">&#160;</div>
                Nombre y firma del docente
            </div>
        </td>
        <td></td>
    </tr>
</table>

</body>
</html>

<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Seguimiento Academico</title>
    <style>
        @page {
            size: letter;
            margin: 12mm 14mm;
        }
        * { box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 8.5pt;
            margin: 0; padding: 0;
            color: #111;
        }
        table { border-collapse: collapse; width: 100%; }

        /* ── HEADER ── */
        .header-table td { padding: 2px 0; vertical-align: middle; }
        .cell-logo { width: 18%; }
        .logo-img { height: 60px; max-width: 100%; }
        .logo-fallback { font-size: 14pt; font-weight: bold; color: #0f172a; }
        .cell-titulo { width: 82%; text-align: center; }
        .colegio-nombre { font-size: 13pt; font-weight: bold; text-decoration: underline; }
        .reporte-nombre { font-size: 11pt; font-weight: bold; margin-top: 4px; }

        /* ── DATOS ALUMNO ── */
        .datos-table { margin-top: 8px; margin-bottom: 6px; }
        .datos-table td { padding: 2px 0; font-size: 9pt; }
        .datos-label { font-weight: bold; }

        /* ── CUATRIMESTRE ── */
        .cuatrimestre-title {
            font-size: 8.5pt; font-weight: bold; text-transform: uppercase;
            padding: 4px 2px 2px 2px;
        }
        .materias-table { border: 1px solid #333; margin-bottom: 2px; }
        .materias-table th {
            background: #e5e5e5; font-size: 7.5pt; font-weight: bold;
            padding: 3px 4px; border: 1px solid #333;
            text-align: center;
        }
        .materias-table td {
            padding: 2px 4px; font-size: 8pt;
            border-left: 1px solid #333; border-right: 1px solid #333;
            border-bottom: 1px solid #ccc;
        }
        .th-num { width: 4%; }
        .th-materia { width: 40%; text-align: left; }
        .th-cal { width: 11%; }
        .td-num { text-align: center; }
        .td-materia { text-align: left; }
        .td-cal { text-align: center; font-variant-numeric: tabular-nums; }
        .promedio-row td {
            font-weight: bold; text-align: right; padding: 3px 6px;
            border-top: 1px solid #333; border-left: 1px solid #333;
            border-right: 1px solid #333; border-bottom: 1px solid #333;
        }

        /* ── PROMEDIO FINAL ── */
        .promedio-final-table { margin-top: 10px; }
        .promedio-final-table td {
            font-size: 10pt; font-weight: bold; padding: 5px 8px;
            border: 1.5px solid #0f172a;
        }
        .promedio-final-label { width: 82%; text-align: right; }
        .promedio-final-value { width: 18%; text-align: center; }
    </style>
</head>
<body>

<!-- ══════════════════════ HEADER ══ -->
<table class="header-table">
    <tr>
        <td class="cell-logo">
            <img th:if="${reporte.logoBase64 != null and !reporte.logoBase64.isEmpty()}"
                 th:src="${reporte.logoBase64}" class="logo-img" th:alt="${reporte.nombreColegio}"/>
        </td>
        <td class="cell-titulo">
            <div class="colegio-nombre" th:text="${reporte.nombreColegio}">Colegio Juan Pablo II</div>
            <div class="reporte-nombre">SEGUIMIENTO ACADEMICO</div>
        </td>
    </tr>
</table>

<!-- ══════════════════════ DATOS ALUMNO ══ -->
<table class="datos-table">
    <tr>
        <td class="datos-label" style="width:12%;">ALUMNO (A):</td>
        <td style="width:58%;" th:text="${reporte.nombreAlumno}">—</td>
        <td class="datos-label" style="width:10%;">FECHA:</td>
        <td style="width:20%;" th:text="${reporte.fechaReporte}">—</td>
    </tr>
    <tr>
        <td class="datos-label">GRUPO:</td>
        <td th:text="${reporte.grupo}">—</td>
        <td class="datos-label">NO. CONTROL:</td>
        <td th:text="${reporte.noControl}">—</td>
    </tr>
</table>

<!-- ══════════════════════ CUATRIMESTRES ══ -->
<div th:each="cuatrimestre : ${reporte.cuatrimestres}">
    <div class="cuatrimestre-title" th:text="${cuatrimestre.descripcioncurso}">CUATRIMESTRE</div>
    <table class="materias-table">
        <thead>
            <tr>
                <th class="th-num">#</th>
                <th class="th-materia">MATERIA</th>
                <th class="th-cal">CALIF. 1</th>
                <th class="th-cal">CALIF 2.</th>
                <th class="th-cal" th:if="${cuatrimestre.mostrarCalifOrdinaria3}">CALIF 3.</th>
                <th class="th-cal">C. EXT. 1</th>
                <th class="th-cal">C. EXT. 2</th>
                <th class="th-cal">FINAL</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="materia, iter : ${cuatrimestre.materias}">
                <td class="td-num" th:text="${iter.count}">1</td>
                <td class="td-materia" th:text="${materia.descripcionmateria}">—</td>
                <td class="td-cal" th:text="${materia.calordinaria1 != null ? #numbers.formatDecimal(materia.calordinaria1, 1, 2) : '—'}">0.00</td>
                <td class="td-cal" th:text="${materia.calordinaria2 != null ? #numbers.formatDecimal(materia.calordinaria2, 1, 2) : '—'}">0.00</td>
                <td class="td-cal" th:if="${cuatrimestre.mostrarCalifOrdinaria3}" th:text="${materia.calordinaria3 != null ? #numbers.formatDecimal(materia.calordinaria3, 1, 2) : '—'}">0.00</td>
                <td class="td-cal" th:text="${materia.calextra1 != null ? #numbers.formatDecimal(materia.calextra1, 1, 2) : '—'}">0.00</td>
                <td class="td-cal" th:text="${materia.calextra2 != null ? #numbers.formatDecimal(materia.calextra2, 1, 2) : '—'}">0.00</td>
                <td class="td-cal" th:text="${materia.calfinal != null ? #numbers.formatDecimal(materia.calfinal, 1, 2) : '—'}">0.00</td>
            </tr>
        </tbody>
    </table>
    <table>
        <tr class="promedio-row">
            <td>PROMEDIO CURSO:
                <span th:text="${cuatrimestre.promedioCurso != null ? #numbers.formatDecimal(cuatrimestre.promedioCurso, 1, 2) : '—'}">0.00</span>
            </td>
        </tr>
    </table>
</div>

<!-- ══════════════════════ PROMEDIO FINAL ══ -->
<table class="promedio-final-table">
    <tr>
        <td class="promedio-final-label">PROMEDIO FINAL</td>
        <td class="promedio-final-value"
            th:text="${reporte.promedioFinal != null ? #numbers.formatDecimal(reporte.promedioFinal, 1, 2) : '—'}">0.00</td>
    </tr>
</table>

</body>
</html>

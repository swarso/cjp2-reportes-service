server:
  port: 8094

spring:
  application:
    name: REPORTES-SERVICE
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

eureka:
  instance:
    # Sin esto, Eureka registra este servicio con el hostname de la máquina (en macOS,
    # algo tipo "nombre-de-la-mac.local", solo resoluble por mDNS) -- cualquier cliente
    # reactivo (Netty) que enrute por lb://REPORTES-SERVICE truena con
    # UnknownHostException al no poder resolver ".local". Con esto se registra por IP.
    #prueba commit    
    
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

colegio:
  nombre: Colegio Juan Pablo II

<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Lista de Asistencia</title>
    <style>
        @page {
            size: letter landscape;
            margin: 10mm 12mm;
        }
        * { box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 8pt;
            margin: 0; padding: 0;
            color: #111;
        }
        table { border-collapse: collapse; width: 100%; }

        /* ── HEADER ── */
        .header-table td { padding: 2px 0; vertical-align: middle; }
        .cell-logo { width: 14%; }
        .logo-img { height: 50px; max-width: 100%; }
        .cell-titulo { width: 86%; text-align: center; }
        .colegio-nombre { font-size: 12pt; font-weight: bold; text-decoration: underline; }
        .reporte-nombre { font-size: 10pt; font-weight: bold; margin-top: 3px; }

        /* ── DATOS ── */
        .datos-table { margin-top: 6px; margin-bottom: 8px; }
        .datos-table td { padding: 2px 0; font-size: 8.5pt; }
        .datos-label { font-weight: bold; }

        /* ── ALUMNOS ── */
        .alumnos-table { border: 1px solid #333; }
        .alumnos-table th {
            background: #e5e5e5; font-size: 7pt; font-weight: bold;
            padding: 3px 3px; border: 1px solid #333;
            text-align: center;
        }
        .alumnos-table td {
            padding: 2px 3px; font-size: 7.5pt;
            border-left: 1px solid #333; border-right: 1px solid #333;
            border-bottom: 1px solid #ccc;
        }
        .th-num { width: 3%; }
        .th-nocontrol { width: 9%; }
        .th-nombre { width: 20%; text-align: left; }
        .th-fecha { width: auto; }
        .td-num { text-align: center; }
        .td-nocontrol { text-align: center; font-family: monospace; }
        .td-nombre { text-align: left; }
        .td-fecha { text-align: center; }
        .asistio-si { color: #15803d; font-weight: bold; }
        .asistio-retardo { color: #b45309; font-weight: bold; }
        .asistio-no { color: #b91c1c; font-weight: bold; }
    </style>
</head>
<body>

<!-- ══════════════════════ HEADER ══ -->
<table class="header-table">
    <tr>
        <td class="cell-logo">
            <img th:if="${reporte.logoBase64 != null and !reporte.logoBase64.isEmpty()}"
                 th:src="${reporte.logoBase64}" class="logo-img" th:alt="${reporte.nombreColegio}"/>
        </td>
        <td class="cell-titulo">
            <div class="colegio-nombre" th:text="${reporte.nombreColegio}">Colegio Juan Pablo II</div>
            <div class="reporte-nombre">LISTA DE ASISTENCIA</div>
        </td>
    </tr>
</table>

<!-- ══════════════════════ DATOS MATERIA/GRUPO ══ -->
<table class="datos-table">
    <tr>
        <td class="datos-label" style="width:10%;">MATERIA:</td>
        <td style="width:40%;" th:text="${reporte.descripcionMateria != null ? reporte.descripcionMateria : '—'}">—</td>
        <td class="datos-label" style="width:8%;">GRUPO:</td>
        <td style="width:20%;" th:text="${reporte.descripcionGrupo != null ? reporte.descripcionGrupo : '—'}">—</td>
        <td class="datos-label" style="width:8%;">FECHA:</td>
        <td style="width:14%;" th:text="${reporte.fechaReporte}">—</td>
    </tr>
</table>

<!-- ══════════════════════ ALUMNOS x FECHAS ══ -->
<table class="alumnos-table">
    <thead>
        <tr>
            <th class="th-num">#</th>
            <th class="th-nocontrol">NO. CONTROL</th>
            <th class="th-nombre">NOMBRE</th>
            <th class="th-fecha" th:each="fecha : ${reporte.fechasSesiones}" th:text="${fecha}">dd/MM</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="alumno, iter : ${reporte.alumnos}">
            <td class="td-num" th:text="${iter.count}">1</td>
            <td class="td-nocontrol" th:text="${alumno.nocontrol}">—</td>
            <td class="td-nombre" th:text="${alumno.nombreAlumno}">—</td>
            <td class="td-fecha" th:each="asistencia : ${alumno.asistencias}"
                th:class="${'td-fecha ' + (asistencia == 'Sí' ? 'asistio-si' : (asistencia == 'Retardo' ? 'asistio-retardo' : (asistencia == 'No' ? 'asistio-no' : '')))}"
                th:text="${asistencia}">—</td>
        </tr>
    </tbody>
</table>

</body>
</html>
